name: Quality

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run db:check
      - run: npm run build
      - run: npm run db:local
      - run: npm run test:e2e
        env:
          CI: true
      - name: Confirm secret and local state are excluded
        shell: bash
        run: |
          git check-ignore -q .env
          git check-ignore -q .dev.vars
          git check-ignore -q .wrangler/state/v3/d1/local.sqlite
          ! grep -RIlE 'sk-(svcacct-|proj-|live-)' public/source.tar.gz public dist/compiler --exclude='*.wasm'

  deploy:
    name: Migrate D1 then deploy
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    concurrency:
      group: khanhhne-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:check
      - name: Verify the Cloudflare deployment token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const accountId = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !/^[a-f0-9]{32}$/i.test(accountId || '')) {
            throw new Error('Cloudflare deployment credentials are not configured correctly.');
          }
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${accountId}/tokens/verify`, {
            headers: { Authorization: `Bearer ${token}` },
          });
          let payload;
          try {
            payload = await response.json();
          } catch {
            throw new Error(`Cloudflare token verification returned invalid JSON (HTTP ${response.status}).`);
          }
          if (!response.ok || !payload.success) {
            throw new Error(`Cloudflare token verification failed (HTTP ${response.status}).`);
          }
          if (payload.result?.status !== 'active') {
            throw new Error('Cloudflare deployment token is not active.');
          }
          const expiresOn = payload.result.expires_on;
          if (expiresOn !== undefined && expiresOn !== null && expiresOn !== '') {
            throw new Error('Cloudflare deployment token must not expire.');
          }
          console.log(`Cloudflare deployment token status: ${payload.result.status}; expiration: none.`);
          NODE
      - name: Apply forward-only D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run build
      - name: Deploy merged master to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.jsonc
